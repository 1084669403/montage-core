[project]
name = "montage-core"
version = "0.1.0"
description = "Chinese-first, agent-driven AI video production system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
http = []  # 已废弃：HTTP 走标准库 urllib，无需 requests
validate = ["jsonschema>=4.20"]  # 别名：jsonschema 已进核心
# starlette 1.x 移除了 APIRouter(on_startup=...)，与 fastapi<0.116 不兼容：
# 实测 fastapi 0.115 + starlette 1.6 会在建应用时直接
# "Router.__init__() got an unexpected keyword argument 'on_startup'"。
webui = ["fastapi>=0.110,<0.116", "starlette>=0.40,<0.42", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["montage*", "lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: 需要本机真实 ffmpeg 的冒烟测试（无 ffmpeg 时 skip）",
]
